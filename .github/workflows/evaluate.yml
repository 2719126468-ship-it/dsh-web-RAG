name: Evaluate (手动触发)

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag-private-docs/requirements.txt || echo "部分依赖安装失败，继续"

      - name: Build index
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          cd rag-private-docs/src
          python indexer.py --force

      - name: Run evaluator (需要 DEEPSEEK_API_KEY)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd rag-private-docs/src
          python evaluator.py --save

      - name: Upload eval result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-result
          path: rag-private-docs/eval/results/*.json
          if-no-files-found: warn
          retention-days: 30
