name: Probe fallback LLM (手动触发)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag-private-docs/requirements.txt || echo "部分依赖安装失败"

      - name: Build index
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          cd rag-private-docs/src
          python indexer.py --force

      - name: Probe fallback LLM behavior
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd rag-private-docs/src
          python probe_fallback.py
