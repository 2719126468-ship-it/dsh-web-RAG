name: Evaluate (手动触发)

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: '数据集: dev 或 holdout'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - holdout
      use_rerank:
        description: '启用 reranker（false 用于测试 fallback）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_critic:
        description: '启用 CRAG critic'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag-private-docs/requirements.txt || echo "部分依赖安装失败，继续"

      - name: Build index
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          cd rag-private-docs/src
          python indexer.py --force

      - name: Run evaluator (需要 DEEPSEEK_API_KEY)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          USE_CRITIC: ${{ inputs.use_critic }}
          USE_RERANK: ${{ inputs.use_rerank }}
        run: |
          cd rag-private-docs/src
          if [ "${{ inputs.dataset }}" = "holdout" ]; then
            python evaluator.py --save --holdout
          else
            python evaluator.py --save
          fi

      - name: Upload eval result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.dataset }}-critic-${{ inputs.use_critic }}
          path: rag-private-docs/eval/results/*.json
          if-no-files-found: warn
          retention-days: 30
