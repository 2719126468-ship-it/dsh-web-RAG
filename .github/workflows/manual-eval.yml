name: Manual Eval

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag-private-docs/requirements.txt

      - name: Check env
        run: |
          echo "PWD: $(pwd)"
          ls rag-private-docs/
          if [ -f rag-private-docs/.env.example ]; then
            cp rag-private-docs/.env.example rag-private-docs/.env
          fi

      - name: Logit check
        run: |
          cd rag-private-docs/src
          python3 -c "from sentence_transformers import CrossEncoder; m = CrossEncoder('BAAI/bge-reranker-base'); scores = m.predict([['合同金额是多少', '合同总金额为人民币肆拾捌万元'], ['合同金额是多少', '今天天气很好适合出门散步']]); print(f'scores = {scores}'); print(f'min = {min(scores):.4f}, max = {max(scores):.4f}'); print('[conclusion] logit, need sigmoid' if min(scores) < 0 or max(scores) > 1 else '[conclusion] already normalized')"

      - name: Run indexer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd rag-private-docs/src
          python indexer.py --force

      - name: Run evaluator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd rag-private-docs/src
          python evaluator.py --save

      - name: Show eval result
        run: |
          find rag-private-docs/eval/results -name "*.json" -exec cat {} \;

      - name: Upload eval result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: rag-private-docs/eval/results/*.json
          retention-days: 30
